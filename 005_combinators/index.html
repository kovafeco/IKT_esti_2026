<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Combinator gyakorlás</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Combinator Selectors</h1>        
    </header>

    <main>
        <section class="cards">
            <h2>Kártyák</h2>

            <div class="card">
                <h3>Cím 1</h3>
                <p>Ez egy bekezdés a kártyában</p>
                <span>Extra info</span>
                <div>
                    <h3>Ez egy mási cím</h3>
                </div>
            </div>

            <div class="card highlight">
                <h3>Cím 2</h3>
                <p>Második bekezdés</p>
            </div>
        </section>
        <section class="articles">
                <h2>Cikkek</h2>
                <article>
                    <h3>Cikk címe </h3>
                    <p>Bekezdés</p>
                    <p>Második</p>
                </article>
                <article>
                    <h3>Második cikk</h3>
                    <p>Bekezdés</p>
                    <p>Másik</p>
                </article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Baross</p>
    </footer>
</body>
</html>
